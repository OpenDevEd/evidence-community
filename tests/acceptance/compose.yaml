x-acceptance-labels: &acceptance-labels
  org.opendeved.evidence-library.acceptance.owner-pid: "${EVIDENCE_LIBRARY_ACCEPTANCE_OWNER_PID:?owner pid is required}"
  org.opendeved.evidence-library.acceptance.persistent: "${EVIDENCE_LIBRARY_ACCEPTANCE_PERSISTENT:-false}"

x-library-service: &library-service
  image: ${EVIDENCE_LIBRARY_ACCEPTANCE_IMAGE:-evidence-library-acceptance:local}
  labels: *acceptance-labels
  depends_on:
    ca-exporter:
      condition: service_completed_successfully
    fixture:
      condition: service_healthy
    mailpit:
      condition: service_healthy
    postgres:
      condition: service_healthy
  restart: "no"
  healthcheck:
    test:
      - CMD
      - node
      - -e
      - fetch("http://127.0.0.1:3000/api/library-config/health").then((response) => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))
    interval: 2s
    timeout: 2s
    retries: 60
    start_period: 10s

x-search-indexer-service: &search-indexer-service
  image: ${EVIDENCE_LIBRARY_ACCEPTANCE_SEARCH_INDEXER_IMAGE:-evidence-library-acceptance-search-indexer:local}
  labels: *acceptance-labels
  restart: "no"

x-meilisearch-service: &meilisearch-service
  image: getmeili/meilisearch:v1.37
  labels: *acceptance-labels
  environment:
    MEILI_MASTER_KEY: acceptance-master-key
    MEILI_NO_ANALYTICS: "true"
  healthcheck:
    test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:7700/health"]
    interval: 2s
    timeout: 2s
    retries: 60
    start_period: 5s

services:
  fixture:
    image: caddy:2.11.4-alpine
    labels: *acceptance-labels
    environment:
      FIXTURE_PORT: "${EVIDENCE_LIBRARY_ACCEPTANCE_FIXTURE_PORT:-4443}"
    networks:
      default:
        aliases:
          - collector.localhost
    ports:
      - "${EVIDENCE_LIBRARY_ACCEPTANCE_FIXTURE_PORT:-4443}:${EVIDENCE_LIBRARY_ACCEPTANCE_FIXTURE_PORT:-4443}"
    tmpfs:
      - /config
    volumes:
      - ./fixture/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    healthcheck:
      test:
        - CMD
        - wget
        - --no-check-certificate
        - --quiet
        - --spider
        - "https://127.0.0.1:${EVIDENCE_LIBRARY_ACCEPTANCE_FIXTURE_PORT:-4443}/health"
      interval: 2s
      timeout: 2s
      retries: 60
      start_period: 5s

  ca-exporter:
    image: alpine:3.23
    labels: *acceptance-labels
    depends_on:
      fixture:
        condition: service_healthy
    command:
      - /bin/sh
      - -euc
      - |
        cp /caddy-data/caddy/pki/authorities/local/root.crt /ca/root.crt
        chmod 0444 /ca/root.crt
    volumes:
      - caddy_data:/caddy-data:ro
      - caddy_ca:/ca

  mailpit:
    image: axllent/mailpit:v1.30.0
    labels: *acceptance-labels
    environment:
      MP_DATABASE: /data/mailpit.db
    ports:
      - "${EVIDENCE_LIBRARY_ACCEPTANCE_MAILPIT_PORT:-38025}:8025"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 2s
      retries: 60
      start_period: 5s

  postgres:
    image: pgvector/pgvector:pg17
    labels: *acceptance-labels
    environment:
      POSTGRES_USER: library
      POSTGRES_PASSWORD: library
      POSTGRES_DB: postgres
    ports:
      - "${EVIDENCE_LIBRARY_ACCEPTANCE_POSTGRES_PORT:-55434}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ../../drizzle:/migrations:ro
      - ./postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U library -d postgres"]
      interval: 2s
      timeout: 2s
      retries: 60
      start_period: 5s

  amber-meilisearch:
    <<: *meilisearch-service
    ports:
      - "${EVIDENCE_LIBRARY_ACCEPTANCE_AMBER_MEILI_PORT:-7712}:7700"

  indigo-meilisearch:
    <<: *meilisearch-service
    ports:
      - "${EVIDENCE_LIBRARY_ACCEPTANCE_INDIGO_MEILI_PORT:-7713}:7700"

  amber:
    <<: *library-service
    environment:
      LIBRARY_CONFIG_PATH: /runtime/config/library.json
      NODE_EXTRA_CA_CERTS: /ca/root.crt
    ports:
      - "${EVIDENCE_LIBRARY_ACCEPTANCE_AMBER_PORT:-3142}:3000"
    volumes:
      - "${EVIDENCE_LIBRARY_ACCEPTANCE_RUNTIME_DIR:?runtime directory is required}/amber:/runtime/config:ro"
      - caddy_ca:/ca:ro

  indigo:
    <<: *library-service
    environment:
      LIBRARY_CONFIG_PATH: /runtime/config/library.json
      NODE_EXTRA_CA_CERTS: /ca/root.crt
    ports:
      - "${EVIDENCE_LIBRARY_ACCEPTANCE_INDIGO_PORT:-3143}:3000"
    volumes:
      - "${EVIDENCE_LIBRARY_ACCEPTANCE_RUNTIME_DIR:?runtime directory is required}/indigo:/runtime/config:ro"
      - caddy_ca:/ca:ro

  amber-search-indexer:
    <<: *search-indexer-service
    depends_on:
      amber-meilisearch:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      LIBRARY_CONFIG_PATH: /runtime/config/library.json
      SEARCH_INDEX_WORKER_ID: acceptance-amber
    volumes:
      - "${EVIDENCE_LIBRARY_ACCEPTANCE_RUNTIME_DIR:?runtime directory is required}/amber:/runtime/config:ro"

  indigo-search-indexer:
    <<: *search-indexer-service
    depends_on:
      indigo-meilisearch:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      LIBRARY_CONFIG_PATH: /runtime/config/library.json
      SEARCH_INDEX_WORKER_ID: acceptance-indigo
    volumes:
      - "${EVIDENCE_LIBRARY_ACCEPTANCE_RUNTIME_DIR:?runtime directory is required}/indigo:/runtime/config:ro"

volumes:
  caddy_ca:
  caddy_data:
