services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        RUNTIME_IMAGE: ${RUNTIME_IMAGE:-platformatic/node-caged:25-slim}
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - "127.0.0.1:${HOST_PORT:?HOST_PORT is required}:3000"
    restart: unless-stopped
    init: true
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
