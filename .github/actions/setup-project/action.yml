name: Set up the Evidence Library
description: Install Node.js and the locked project dependencies.

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 22
        cache: npm

    - name: Install dependencies
      shell: bash
      run: npm ci --prefer-offline --no-audit --no-fund
