name: Blacksmith Testbox
on:
  workflow_dispatch:
    inputs:
      testbox_id:
        type: string
        description: "Testbox session ID"
        required: true
  pull_request:
    paths:
      - '.github/workflows/**'

jobs:
  runtime:
    name: Runtime testbox
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 60
    steps:
      - name: Begin Testbox
        uses: useblacksmith/begin-testbox@233448af4bfdc6fca509a7f0974411ac6d8a8043 # v2
        with:
          testbox_id: ${{ inputs.testbox_id }}

      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup-project

      - name: Keep Node.js 22 on the Testbox command path
        shell: bash
        run: |
          mkdir -p "$HOME/.local/bin"
          ln -sfn "$(command -v node)" "$HOME/.local/bin/node"
          ln -sfn "$(command -v npm)" "$HOME/.local/bin/npm"
          ln -sfn "$(command -v npx)" "$HOME/.local/bin/npx"

      - name: Restore the Playwright browser cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium and its system packages
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Set up the cached Docker builder
        uses: useblacksmith/setup-docker-builder@a5256a73e30f09e37e3eceb8ca36043d17621d24 # v2
        with:
          cache-key: evidence-library-runtime

      - name: Run Testbox
        uses: useblacksmith/run-testbox@5ca05834db1d3813554d1dd109e5f2087a8d7cbc # v2
        if: always()
