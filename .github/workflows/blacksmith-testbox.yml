name: Blacksmith Testbox
on:
  workflow_dispatch:
    inputs:
      testbox_id:
        type: string
        description: "Testbox session ID"
        required: true
  pull_request:
    paths:
      - '.github/workflows/blacksmith-testbox.yml'
      - '.github/actions/setup-project/action.yml'

jobs:
  runtime:
    name: Runtime testbox
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 60
    steps:
      - name: Begin Testbox
        uses: useblacksmith/begin-testbox@v2
        with:
          testbox_id: ${{ inputs.testbox_id }}

      - name: Check out the repository
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup-project

      - name: Restore the Playwright browser cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium and its system packages
        run: npx playwright install --with-deps chromium

      - name: Set up the cached Docker builder
        uses: useblacksmith/setup-docker-builder@v2
        with:
          cache-key: evidence-library-runtime

      - name: Run Testbox
        uses: useblacksmith/run-testbox@v2
        if: always()
