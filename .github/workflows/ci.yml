name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Only the newest commit on a branch needs to finish.
concurrency:
  group: ci-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: ${{ matrix.name }}
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      - self-hosted
      - evidence-library-light
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Lint
            command: npm run lint
          - name: Type check
            command: npm run typecheck
          - name: Generated schemas
            command: npm run schema:check
          - name: Unit tests
            command: npm test
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup-project

      - name: Run ${{ matrix.name }}
        run: ${{ matrix.command }}

  runtime:
    name: Runtime acceptance
    # This suite includes every browser spec and builds the production image.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      - self-hosted
      - evidence-library-runtime
    timeout-minutes: 45
    env:
      PLAYWRIGHT_WORKERS: "4"
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup-project

      - name: Restore the Playwright browser cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium and its system packages
        run: ./node_modules/.bin/playwright install chromium

      - name: Use the persistent Docker builder
        run: |
          docker buildx use evidence-library-runtime
          docker buildx inspect --bootstrap

      - name: Run end-to-end tests
        run: npm run test:acceptance

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: runtime-acceptance
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  code-quality:
    name: Fallow code quality
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      - self-hosted
      - evidence-library-light
    timeout-minutes: 10
    env:
      FALLOW_PUSH_BASE_REF: refs/tags/fallow-ci-baseline-2026-08-21
    steps:
      - name: Check out the repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Test the comparison rules
        run: bash tests/ci/fallow-comparison.test.sh

      - name: Resolve the comparison commit
        id: comparison
        shell: bash
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          comparison_sha="$(bash .github/scripts/resolve-fallow-comparison.sh)"
          echo "sha=$comparison_sha" >> "$GITHUB_OUTPUT"

      - name: Block new code-quality problems
        uses: fallow-rs/fallow@ecf5a314fd3e10974acb4f5a7f867c433030522d # v3.17.0
        with:
          command: audit
          version: 3.17.0
          gate: new-only
          changed-since: ${{ steps.comparison.outputs.sha }}
          fail-on-issues: true
          annotations: true

  ci:
    name: CI
    runs-on:
      - self-hosted
      - evidence-library-light
    timeout-minutes: 5
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    needs:
      - code-quality
      - static-checks
      - runtime
    steps:
      - name: Require every CI lane to pass
        env:
          CODE_QUALITY: ${{ needs.code-quality.result }}
          STATIC_CHECKS: ${{ needs.static-checks.result }}
          RUNTIME: ${{ needs.runtime.result }}
        run: |
          test "$CODE_QUALITY" = success
          test "$STATIC_CHECKS" = success
          test "$RUNTIME" = success
