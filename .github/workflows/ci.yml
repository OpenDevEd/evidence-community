name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  # The full runtime suite once a night, for what changes without a commit: base images,
  # dependencies resolved at build time, and the date. Static checks and unit tests already
  # passed on the same commit.
  schedule:
    - cron: "23 2 * * *"

permissions:
  contents: read

# Only the newest commit on a branch needs to finish. The nightly run has its own group, so it
# never cancels the run of a merge, whose success publishes the runtime image.
concurrency:
  group: ci-${{ github.event_name == 'schedule' && 'nightly' || github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  # A pull request run tests the merge result. When it passed, it records the
  # tree it tested. A push whose tree matches skips the static checks and unit
  # tests; the runtime job still runs the full suite.
  tested:
    name: Tested tree
    if: github.event_name == 'push'
    runs-on:
      - self-hosted
      - evidence-library-light
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      passed: ${{ steps.lookup.outputs.passed }}
    steps:
      - name: Look for a passed pull request run of this tree
        id: lookup
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY"
          auth="Authorization: Bearer $GITHUB_TOKEN"
          # Any lookup failure runs the full suite.
          passed=false
          tree="$(curl -fsS -H "$auth" "$api/git/commits/$GITHUB_SHA" | jq -r .tree.sha)" || tree=""
          runs=""
          if [ -n "$tree" ]; then
            runs="$(curl -fsS -H "$auth" "$api/actions/artifacts?name=ci-passed-$tree" \
              | jq -r '.artifacts[] | select(.expired | not) | .workflow_run.id')" || runs=""
          fi
          # Only a successful pull request run of this workflow from this
          # repository counts. A fork could upload the same artifact name.
          for run in $runs; do
            if curl -fsS -H "$auth" "$api/actions/runs/$run" | jq -e --arg repository "$GITHUB_REPOSITORY" \
              '.path == ".github/workflows/ci.yml" and .event == "pull_request" and .conclusion == "success" and .head_repository.full_name == $repository' > /dev/null; then
              passed=true
              echo "Pull request run $run already passed tree $tree."
              break
            fi
          done
          echo "passed=$passed" >> "$GITHUB_OUTPUT"

  static-checks:
    name: Static checks
    needs: tested
    if: ${{ !cancelled() && needs.tested.outputs.passed != 'true' && github.event_name != 'schedule' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on:
      - self-hosted
      - evidence-library-light
    timeout-minutes: 15
    steps:
      - name: Check out the repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Test the comparison rules
        run: bash tests/ci/fallow-comparison.test.sh

      - name: Resolve the comparison commit
        id: comparison
        shell: bash
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          comparison_sha="$(bash .github/scripts/resolve-fallow-comparison.sh)"
          echo "sha=$comparison_sha" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-project

      # The five checks share the runner's CPUs. Each writes its own log, printed whole once
      # all five have finished. Fallow and ESLint keep their caches on the runner's disk, so
      # a check after a small change reads only what changed.
      - name: Fallow, lint, type check, generated schemas and UI rules
        env:
          COMPARISON_SHA: ${{ steps.comparison.outputs.sha }}
        run: |
          eslint_cache="$HOME/.cache/new-el-eslint/"
          export FALLOW_CACHE_DIR="$HOME/.cache/new-el-fallow"
          names=("Fallow" "Lint" "Type check" "Generated schemas" "UI rules")
          commands=(
            "npx fallow audit --gate new-only --changed-since $COMPARISON_SHA --fail-on-issues --format github-annotations"
            "npm run lint -- --cache --cache-strategy content --cache-location $eslint_cache"
            "npm run typecheck"
            "npm run schema:check"
            "npm run check:ui-rules"
          )
          pids=()
          for i in "${!names[@]}"; do
            TIMEFORMAT="Took %R s, %U s user and %S s system CPU." bash -c "time ${commands[$i]}" > "$RUNNER_TEMP/check-$i.log" 2>&1 &
            pids+=("$!")
          done
          failed=()
          for i in "${!names[@]}"; do
            if wait "${pids[$i]}"; then result=passed; else result=failed; failed+=("${names[$i]}"); fi
            echo "::group::${names[$i]} $result"
            cat "$RUNNER_TEMP/check-$i.log"
            echo "::endgroup::"
          done
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "::error::Failed: ${failed[*]}"
            exit 1
          fi

  unit-tests:
    name: Unit tests
    needs: tested
    if: ${{ !cancelled() && needs.tested.outputs.passed != 'true' && github.event_name != 'schedule' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on:
      - self-hosted
      - evidence-library-light
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup-project

      - name: Run unit tests
        run: npm test

  runtime:
    name: Runtime acceptance and integration
    # Builds the production image. A pull request runs the smoke scope: Amber, its API checks
    # and the browser tests tagged @smoke. main and the nightly run run every browser spec on
    # both libraries, so a push to main runs this even when its tree passed as a pull request.
    needs: tested
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on:
      - self-hosted
      - evidence-library-runtime
    timeout-minutes: 45
    env:
      EVIDENCE_LIBRARY_ACCEPTANCE_SCOPE: ${{ github.event_name == 'pull_request' && 'smoke' || 'full' }}
      # The public suites flake above four. On the 8-vCPU guest the admin suite takes the same
      # time and CPU with four workers as with eight.
      PLAYWRIGHT_WORKERS: "4"
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup-project

      # The browsers stay in ~/.cache/ms-playwright between jobs, so this only
      # downloads when the lockfile selects a new Chromium.
      - name: Install Chromium
        run: ./node_modules/.bin/playwright install chromium

      # Each runtime runner has its own rootless Docker, and each daemon hands out host ports
      # from the same range without knowing the others' bindings, so a service container's
      # random port can collide with another job's. The integration database takes a port
      # the guest reports free, and tries another if a job takes it first.
      - name: Start the integration database
        run: |
          set -euo pipefail
          # A job that died before its cleanup leaves its database holding a port. This Docker
          # serves only this runner, which runs one job at a time, so any such container is stale.
          docker ps -aq --filter "name=^integration-db-" | xargs -r docker rm -fv > /dev/null
          name="integration-db-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${RUNNER_NAME}"
          echo "INTEGRATION_DB_CONTAINER=$name" >> "$GITHUB_ENV"
          for attempt in 1 2 3 4 5; do
            port="$(node -e 'const s=require("net").createServer().listen(0,"127.0.0.1",()=>{console.log(s.address().port);s.close()})')"
            if docker run -d --name "$name" -e POSTGRES_PASSWORD=integration -p "127.0.0.1:$port:5432" \
              --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 30 pgvector/pgvector:pg17 > /dev/null; then
              break
            fi
            docker rm -f "$name" > /dev/null 2>&1 || true
            [ "$attempt" = 5 ] && { echo "::error::No free port for the integration database"; exit 1; }
          done
          for second in $(seq 1 120); do
            health="$(docker inspect -f '{{.State.Health.Status}}' "$name" 2>/dev/null || echo missing)"
            [ "$health" = healthy ] && break
            if [ "$health" = unhealthy ] || [ "$health" = missing ] || [ "$second" = 120 ]; then
              docker logs --tail 50 "$name" 2>&1 || true
              echo "::error::The integration database is $health after $second seconds"
              exit 1
            fi
            sleep 1
          done
          echo "INTEGRATION_DATABASE_URL=postgresql://postgres:integration@localhost:$port/postgres" >> "$GITHUB_ENV"

      - name: Use the persistent Docker builder
        run: |
          docker buildx use evidence-library-runtime
          docker buildx inspect --bootstrap

      - name: Check the library compose contract
        run: npm run test:library-compose

      # The deployment checks start their own containers: the repository's Compose stack and a
      # root-owned config. A pull request that changes no deployment file skips them; main and
      # a diff that can't be read run them.
      - name: Decide the deployment checks
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git fetch --quiet --no-tags --depth=1 origin "$BASE_SHA" && changed="$(git diff --name-only "$BASE_SHA" HEAD)"; then
            if grep -qE '^(Dockerfile|docker/|docker-bake|compose\.|entrypoint\.sh|tests/acceptance/|tools/(runRuntimeAcceptance|verifyLibraryCompose)\.ts|src/lib/deployment/|drizzle/|package(-lock)?\.json$|next\.config\.|\.github/workflows/ci\.yml)' <<< "$changed"; then
              echo "A deployment file changed: running the deployment checks."
            else
              echo "EVIDENCE_LIBRARY_ACCEPTANCE_DEPLOYMENT_CHECKS=false" >> "$GITHUB_ENV"
              echo "No deployment file changed: skipping the deployment checks."
            fi
          else
            echo "Could not read the changed files: running the deployment checks."
          fi

      - name: Run end-to-end and integration tests
        run: |
          # The integration tests need only their own database, so they run
          # beside the acceptance suite instead of holding a second runner.
          DATABASE_URL_POST="$INTEGRATION_DATABASE_URL" npm run test:integration \
            > "$RUNNER_TEMP/integration.log" 2>&1 &
          integration=$!
          acceptance_status=0
          npm run test:acceptance || acceptance_status=$?
          integration_status=0
          wait "$integration" || integration_status=$?
          echo "::group::Database and publication integration"
          cat "$RUNNER_TEMP/integration.log"
          echo "::endgroup::"
          if (( acceptance_status != 0 || integration_status != 0 )); then
            printf '::error::Failed: acceptance=%s integration=%s\n' "$acceptance_status" "$integration_status"
            exit 1
          fi

      # A cancelled job can stop the suite before its own cleanup runs.
      - name: Remove this runner's abandoned acceptance stacks
        if: failure() || cancelled()
        run: npm run test:acceptance:cleanup

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: runtime-acceptance
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove the integration database
        if: always()
        run: docker rm -fv "${INTEGRATION_DB_CONTAINER:-}" > /dev/null 2>&1 || true

  ci:
    name: CI
    runs-on:
      - self-hosted
      - evidence-library-light
    timeout-minutes: 5
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      issues: write
    needs:
      - tested
      - static-checks
      - unit-tests
      - runtime
    steps:
      - name: Require every CI lane to pass
        env:
          TESTED: ${{ needs.tested.outputs.passed }}
          STATIC_CHECKS: ${{ needs.static-checks.result }}
          UNIT_TESTS: ${{ needs.unit-tests.result }}
          RUNTIME: ${{ needs.runtime.result }}
        run: |
          if [ "$TESTED" = true ]; then
            echo "A pull request run already passed the static checks and unit tests on this tree."
          elif [ "$GITHUB_EVENT_NAME" = schedule ]; then
            echo "The nightly run checks what changes without a commit, so it runs the runtime job alone."
          else
            test "$STATIC_CHECKS" = success
            test "$UNIT_TESTS" = success
          fi
          test "$RUNTIME" = success

      # A failure reopens the newest issue with this title, open or closed, or opens one in EL-15.
      # The job's token can't add issues to the organization's board.
      - name: Report a failed nightly run
        if: failure() && github.event_name == 'schedule'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY"
          auth="Authorization: Bearer $GITHUB_TOKEN"
          title="[EL-15] Nightly CI fails on main"
          body="The full suite failed on $GITHUB_SHA: $RUN_URL"
          issue="$(curl -fsS -G -H "$auth" "$GITHUB_API_URL/search/issues" \
            --data-urlencode "q=repo:$GITHUB_REPOSITORY is:issue in:title \"$title\"" \
            | jq -r --arg title "$title" '[.items[] | select(.title == $title)] | max_by(.number) | .number // empty')"
          if [ -n "$issue" ]; then
            curl -fsS -X PATCH -H "$auth" -d '{"state": "open"}' "$api/issues/$issue" > /dev/null
            jq -n --arg body "$body" '{body: $body}' | curl -fsS -H "$auth" -d @- "$api/issues/$issue/comments" > /dev/null
            echo "Reopened and commented on issue #$issue."
          else
            milestone="$(curl -fsS -H "$auth" "$api/milestones?state=open&per_page=100" \
              | jq -r 'map(select(.title | startswith("EL-15 ")))[0].number // empty')"
            [ -n "$milestone" ] || echo "::warning::No open EL-15 milestone, so the issue has none."
            jq -n --arg title "$title" --arg body "$body" --arg milestone "$milestone" \
              '{title: $title, body: $body} + (if $milestone == "" then {} else {milestone: ($milestone | tonumber)} end)' \
              | curl -fsS -H "$auth" -d @- "$api/issues" | jq -r '"Opened issue #\(.number)."'
          fi

      - name: Name the tested tree
        id: tree
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tree="$(curl -fsS -H "Authorization: Bearer $GITHUB_TOKEN" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/commits/$GITHUB_SHA" | jq -r .tree.sha)"
          echo "$tree" > "$RUNNER_TEMP/tested-tree"
          echo "sha=$tree" >> "$GITHUB_OUTPUT"

      - name: Record the tested tree
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-passed-${{ steps.tree.outputs.sha }}
          path: ${{ runner.temp }}/tested-tree
          retention-days: 14
