name: CI

on:
  push:
    branches:
      - openscholar
  pull_request:
    branches:
      - openscholar
  workflow_dispatch:

permissions:
  contents: read

# Only the newest commit on a branch needs to finish.
concurrency:
  group: ci-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: ${{ matrix.name }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Lint
            command: npm run lint
          - name: Type check
            command: ./node_modules/.bin/tsc --noEmit
          - name: Generated schemas
            command: npm run schema:check
          - name: Unit tests
            command: npm run test:unit
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup-project

      - name: Run ${{ matrix.name }}
        run: ${{ matrix.command }}

  runtime:
    name: Runtime acceptance
    # This suite includes every browser spec and builds the production image.
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 45
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup-project

      - name: Restore the Playwright browser cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium and its system packages
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Set up the cached Docker builder
        uses: useblacksmith/setup-docker-builder@a5256a73e30f09e37e3eceb8ca36043d17621d24 # v2
        with:
          cache-key: evidence-library-runtime

      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: runtime-acceptance
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  ci:
    name: CI
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    if: always()
    needs:
      - static-checks
      - runtime
    steps:
      - name: Require every CI lane to pass
        env:
          STATIC_CHECKS: ${{ needs.static-checks.result }}
          RUNTIME: ${{ needs.runtime.result }}
        run: |
          test "$STATIC_CHECKS" = success
          test "$RUNTIME" = success
