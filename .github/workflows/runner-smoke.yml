name: Runner smoke

on:
  push:
    branches:
      - codex/self-hosted-ci

permissions:
  contents: read

jobs:
  smoke:
    name: Isolated light runner
    runs-on:
      - self-hosted
      - evidence-library-light
    timeout-minutes: 5
    steps:
      - name: Verify the runner boundary
        shell: bash
        run: |
          set -euo pipefail

          cgroup_path="$(awk -F: '$1 == "0" { print $3 }' /proc/self/cgroup)"

          test "$RUNNER_NAME" = "new-el-ci-light-1"
          test "$(cat "/sys/fs/cgroup${cgroup_path}/cpu.max")" = "200000 100000"
          test "$(cat "/sys/fs/cgroup${cgroup_path}/memory.max")" = "8589934592"

          if sudo -n true 2>/dev/null; then
            echo "The runner can use sudo." >&2
            exit 1
          fi

          curl --fail --silent --show-error --head --max-time 10 https://github.com >/dev/null

          if curl --fail --silent --max-time 3 http://178.63.162.33 >/dev/null 2>&1; then
            echo "The runner can reach the Coolify host." >&2
            exit 1
          fi
