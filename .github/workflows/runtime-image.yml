name: Runtime image

on:
  workflow_run:
    workflows:
      - CI
    branches:
      - main
    types:
      - completed
  workflow_dispatch:
    inputs:
      commit:
        description: Exact green commit from main
        required: true
        type: string

permissions: {}

concurrency:
  group: runtime-image-${{ github.event.workflow_run.head_sha || inputs.commit }}
  cancel-in-progress: false

jobs:
  select:
    name: Select the green commit
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on:
      group: Evidence Library Release
      labels: evidence-library-release
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      commit: ${{ steps.release.outputs.commit }}
      previous: ${{ steps.previous.outputs.commit }}
      released: ${{ steps.previous.outputs.released }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Select the exact green commit
        id: release
        env:
          DISPATCH_COMMIT: ${{ inputs.commit }}
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_TOKEN: ${{ github.token }}
          WORKFLOW_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            runtime_commit="$DISPATCH_COMMIT"
          else
            runtime_commit="$WORKFLOW_COMMIT"
          fi
          if ! [[ "$runtime_commit" =~ ^[a-f0-9]{40}$ ]]; then
            echo "The runtime commit must be 40 lowercase hexadecimal characters." >&2
            exit 1
          fi

          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$runtime_commit" origin/main; then
            echo "The runtime commit is not part of main." >&2
            exit 1
          fi

          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            runs_url="https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&head_sha=$runtime_commit&status=completed&per_page=100"
            green_runs="$(curl --fail --silent --show-error \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $GITHUB_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "$runs_url" | jq --arg commit "$runtime_commit" \
              '[.workflow_runs[] | select(.head_sha == $commit and .conclusion == "success")] | length')"
            if [ "$green_runs" -lt 1 ]; then
              echo "The runtime commit does not have a successful main CI run." >&2
              exit 1
            fi
          fi

          echo "commit=$runtime_commit" >> "$GITHUB_OUTPUT"

      # The previous release is the newest one whose commit comes before this
      # one on main. The notes cover everything merged between the two.
      - name: Find the previous release
        id: previous
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUNTIME_COMMIT: ${{ steps.release.outputs.commit }}
        run: |
          set -euo pipefail
          releases="$(curl --fail --silent --show-error \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases?per_page=100")"
          released=false
          previous=""
          for candidate in $(jq -r '.[].tag_name' <<< "$releases" \
            | sed -n 's/^runtime-\([a-f0-9]\{40\}\)$/\1/p'); do
            if [ "$candidate" = "$RUNTIME_COMMIT" ]; then
              released=true
              continue
            fi
            if git merge-base --is-ancestor "$candidate" "$RUNTIME_COMMIT" &&
              { [ -z "$previous" ] || git merge-base --is-ancestor "$previous" "$candidate"; }; then
              previous="$candidate"
            fi
          done
          echo "released=$released" >> "$GITHUB_OUTPUT"
          echo "commit=$previous" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish runtime image
    needs: select
    runs-on:
      group: Evidence Library Release
      labels: evidence-library-release
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
      reference: ${{ steps.image.outputs.reference }}
    steps:
      - name: Check out the release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.select.outputs.commit }}
          fetch-depth: 0

      - name: Log in to the package registry
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io \
            --username "$GITHUB_ACTOR" --password-stdin

      - name: Use the persistent release builder
        run: |
          docker buildx use evidence-library-release
          docker buildx inspect --bootstrap

      - name: Publish the immutable image
        id: image
        env:
          RUNTIME_COMMIT: ${{ needs.select.outputs.commit }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RUNTIME_COMMIT"
          image="ghcr.io/opendeved/evidence-library-runtime:$RUNTIME_COMMIT"
          inspection="$RUNNER_TEMP/runtime-image-inspection.json"
          metadata="$RUNNER_TEMP/runtime-image-metadata.json"

          if docker buildx imagetools inspect --format '{{json .}}' "$image" > "$inspection" 2>/dev/null; then
            revision="$(jq -r '.image.config.Labels["org.opencontainers.image.revision"] // empty' "$inspection")"
            digest="$(jq -r '.manifest.digest // empty' "$inspection")"
            if [ "$revision" != "$RUNTIME_COMMIT" ]; then
              echo "The existing image tag belongs to a different source commit." >&2
              exit 1
            fi
          else
            docker buildx build \
              --builder evidence-library-release \
              --target library-runtime \
              --platform linux/amd64 \
              --build-arg SKIP_BUILD_TYPECHECK=1 \
              --label org.opencontainers.image.source=https://github.com/OpenDevEd/evidence-community \
              --label "org.opencontainers.image.revision=$RUNTIME_COMMIT" \
              --tag "$image" \
              --metadata-file "$metadata" \
              --push .
            digest="$(jq -r '."containerimage.digest" // empty' "$metadata")"
          fi

          if ! [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "The registry did not return an immutable image digest." >&2
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "reference=ghcr.io/opendeved/evidence-library-runtime@$digest" >> "$GITHUB_OUTPUT"

      - name: Record the published image
        env:
          RUNTIME_COMMIT: ${{ needs.select.outputs.commit }}
          RUNTIME_DIGEST: ${{ steps.image.outputs.digest }}
          RUNTIME_REFERENCE: ${{ steps.image.outputs.reference }}
        run: |
          {
            echo '### Evidence Library runtime image'
            echo
            echo "- Commit: \`$RUNTIME_COMMIT\`"
            echo "- Digest: \`$RUNTIME_DIGEST\`"
            echo "- Pull: \`$RUNTIME_REFERENCE\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # Runs beside the image build. The release below needs both to succeed, so
  # an image without notes is never offered as an update.
  notes:
    name: Write the release notes
    needs: select
    if: needs.select.outputs.released != 'true'
    runs-on:
      - self-hosted
      - evidence-library-light
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    outputs:
      body: ${{ steps.notes.outputs.body }}
    steps:
      - name: Check out the release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.select.outputs.commit }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Write the notes
        id: notes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PREVIOUS_COMMIT: ${{ needs.select.outputs.previous }}
          RUNTIME_COMMIT: ${{ needs.select.outputs.commit }}
        run: |
          set -euo pipefail
          if [ -n "$PREVIOUS_COMMIT" ]; then
            range="$PREVIOUS_COMMIT..$RUNTIME_COMMIT"
          else
            range="$RUNTIME_COMMIT^!"
          fi
          git log --first-parent --format='%H%x1f%s%x1f%b%x1e' "$range" \
            | node .github/scripts/release-notes.mjs > "$RUNNER_TEMP/release-notes.md"
          # Openscholar's releases page warns about these. A migration is a new
          # file directly under drizzle/; drizzle/rollback/ doesn't count.
          database_changes=0
          if [ -n "$PREVIOUS_COMMIT" ]; then
            database_changes="$(git diff --name-only --diff-filter=A "$PREVIOUS_COMMIT" "$RUNTIME_COMMIT" -- ':(glob)drizzle/*.sql' | wc -l | tr -d ' ')"
          fi
          printf '\nDatabase changes: %s\n' "$database_changes" >> "$RUNNER_TEMP/release-notes.md"
          cat "$RUNNER_TEMP/release-notes.md"
          {
            echo 'body<<END_OF_RELEASE_NOTES'
            cat "$RUNNER_TEMP/release-notes.md"
            echo 'END_OF_RELEASE_NOTES'
          } >> "$GITHUB_OUTPUT"

  # Published as a prerelease: shared dev offers it at once, and production
  # only after it's promoted on Openscholar's community releases page.
  release:
    name: Record the release
    needs:
      - select
      - publish
      - notes
    runs-on:
      group: Evidence Library Release
      labels: evidence-library-release
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Publish the GitHub release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ needs.notes.outputs.body }}
          RUNTIME_COMMIT: ${{ needs.select.outputs.commit }}
          RUNTIME_REFERENCE: ${{ needs.publish.outputs.reference }}
        run: |
          set -euo pipefail
          if [ -z "$RELEASE_NOTES" ]; then
            echo "The release notes are empty." >&2
            exit 1
          fi
          body="$(printf '%s\n\nImage: `%s`\nCommit: `%s`\n' "$RELEASE_NOTES" "$RUNTIME_REFERENCE" "$RUNTIME_COMMIT")"
          jq -n \
            --arg tag "runtime-$RUNTIME_COMMIT" \
            --arg commit "$RUNTIME_COMMIT" \
            --arg name "Runtime ${RUNTIME_COMMIT:0:7}" \
            --arg body "$body" \
            '{tag_name: $tag, target_commitish: $commit, name: $name, body: $body, prerelease: true}' \
            | curl --fail --silent --show-error \
              --request POST \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $GITHUB_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              --data @- \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/releases" \
            | jq -r '.html_url'
          {
            echo '### Release notes'
            echo
            echo "$RELEASE_NOTES"
          } >> "$GITHUB_STEP_SUMMARY"
