# One Elasticsearch for every Evidence Library on this host (OpenDevEd/new-el#718). Deploy it once per host,
# before the libraries: it creates the `library-search` network their web and search-indexer containers join.
# Each library reaches it as http://elasticsearch:9200 with its own login, which the database provisioner creates
# and limits to that library's indexes. It has no published port and joins no other network.
name: evidence-library-search

services:
    elasticsearch:
        build:
            context: .
            dockerfile: docker/elasticsearch.Dockerfile
        image: evidence-library-elasticsearch:9.5.5
        init: true
        environment:
            discovery.type: single-node
            cluster.name: evidence-library-search
            ELASTIC_PASSWORD: "${ELASTICSEARCH_ADMIN_PASSWORD:?the Elasticsearch administrator password is required}"
            xpack.security.enabled: "true"
            # Only containers on this host's private network reach it, so its HTTP stays plain.
            xpack.security.http.ssl.enabled: "false"
            # Heap from the measurement in plans/elasticsearch-search/01-size-on-a-real-library.md.
            ES_JAVA_OPTS: "-Xms${ELASTICSEARCH_HEAP:-4g} -Xmx${ELASTICSEARCH_HEAP:-4g}"
            bootstrap.memory_lock: "true"
        ulimits:
            memlock:
                soft: -1
                hard: -1
            nofile:
                soft: 65536
                hard: 65536
        volumes:
            - elasticsearch-data:/usr/share/elasticsearch/data
        networks:
            library-search:
                aliases:
                    - elasticsearch
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "curl -fsS -u \"elastic:$$ELASTIC_PASSWORD\" 'http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null",
                ]
            interval: 30s
            timeout: 10s
            start_period: 120s
            start_interval: 2s
            retries: 3
        restart: unless-stopped

volumes:
    elasticsearch-data:

networks:
    library-search:
        name: library-search
