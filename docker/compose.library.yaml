x-runtime-environment: &runtime-environment
  LIBRARY_CONFIG_PATH: /runtime/config/library.json

x-runtime-config: &runtime-config
  source: library-config
  target: /runtime/config/library.json
  mode: 0444

x-search-build: &search-build
  context: .
  dockerfile: Dockerfile
  target: search-indexer

x-source-build: &source-build
  context: .
  dockerfile: Dockerfile

x-runtime-networks: &runtime-networks
  - private
  - coolify

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: final
    environment: *runtime-environment
    configs:
      - *runtime-config
    networks: *runtime-networks
    depends_on:
      search-indexer:
        condition: service_healthy
    labels:
      - "traefik.docker.network=coolify"
    restart: unless-stopped
    expose:
      - "3000"

  search-indexer:
    build: *search-build
    command:
      - /bin/sh
      - -euc
      - npm run db:migrate && exec node_modules/.bin/tsx tools/runSearchIndexer.ts --watch
    environment:
      <<: *runtime-environment
      SEARCH_INDEX_WORKER_ID: search-indexer
    configs:
      - *runtime-config
    networks: *runtime-networks
    depends_on:
      meilisearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node_modules/.bin/tsx", "tools/checkSearchIndexerHealth.ts"]
      interval: 15s
      timeout: 5s
      start_period: 1h
      retries: 3
    restart: unless-stopped

  source-sync:
    build:
      <<: *source-build
      target: source-sync
    environment:
      <<: *runtime-environment
      SOURCE_SYNC_WORKER_ID: source-sync
    configs:
      - *runtime-config
    networks: *runtime-networks
    depends_on:
      search-indexer:
        condition: service_healthy
    restart: unless-stopped

  source-writeback:
    build:
      <<: *source-build
      target: source-writeback
    environment:
      <<: *runtime-environment
      SOURCE_WRITEBACK_WORKER_ID: source-writeback
    configs:
      - *runtime-config
    networks: *runtime-networks
    depends_on:
      search-indexer:
        condition: service_healthy
    restart: unless-stopped

  meilisearch:
    image: getmeili/meilisearch:v1.37
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: "${MEILISEARCH_MASTER_KEY:?private Meilisearch key is required}"
      MEILI_NO_ANALYTICS: "true"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:7700/health"]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 12
    volumes:
      - meilisearch-data:/meili_data
    networks:
      - private
    restart: unless-stopped

configs:
  library-config:
    content: "${LIBRARY_CONFIG_JSON:?library config JSON is required}"

volumes:
  meilisearch-data:

networks:
  private:
  coolify:
    name: coolify
    external: true
