x-runtime-environment: &runtime-environment
    LIBRARY_CONFIG_PATH: /runtime/config/library.json
    LIBRARY_CONFIG_SEED_PATH: /runtime/config-seed/library.json

x-runtime-config: &runtime-config
    source: library-config
    target: /runtime/config-seed/library.json
    mode: 0444

x-runtime-volume: &runtime-volume
    type: volume
    source: library-config-data
    target: /runtime/config

x-runtime-labels: &runtime-labels
    org.opendeved.evidence-library.release: "${SOURCE_COMMIT:?source commit is required}"

x-runtime-networks: &runtime-networks
    - private
    - coolify

# The containers that search join the host's shared Elasticsearch network too (docker/compose.search.yaml).
x-search-networks: &search-networks
    - private
    - coolify
    - library-search

# Every library on a host shares one systemd slice, which the host caps (16
# cores, 64 GB on hetzner), so libraries reindexing at once slow each other
# down instead of starving the other services on the machine. Docker creates
# the slice with no limits on a host that doesn't define it.
x-library-budget: &library-budget libraries.slice

services:
    web:
        cgroup_parent: *library-budget
        init: true
        image: "${RUNTIME_IMAGE:?runtime image digest is required}"
        pull_policy: missing
        command: ["node_modules/.bin/next", "start"]
        environment: *runtime-environment
        configs:
            - *runtime-config
        volumes:
            - *runtime-volume
        networks: *search-networks
        depends_on:
            publication-worker:
                condition: service_healthy
            redis:
                condition: service_healthy
            search-indexer:
                condition: service_healthy
        labels:
            <<: *runtime-labels
            traefik.docker.network: coolify
            # Coolify adds these middlewares to every router it creates for
            # this service, so the platform address gets the browser check
            # that custom domains get from their own route file.
            coolify.traefik.middlewares: ode-library-shield@file
        restart: unless-stopped
        expose:
            - "3000"
        # Every health check below probes each second while its container
        # starts, then rarely. Each probe is a docker exec, and with many
        # libraries on one host the probes alone kept the Docker daemons busy.
        healthcheck:
            test:
                [
                    "CMD",
                    "node",
                    "-e",
                    "fetch('http://127.0.0.1:3000/api/library-config/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
                ]
            interval: 30s
            timeout: 5s
            start_period: 30s
            start_interval: 1s
            retries: 3

    search-indexer:
        cgroup_parent: *library-budget
        init: true
        image: "${RUNTIME_IMAGE:?runtime image digest is required}"
        pull_policy: missing
        command:
            - /bin/sh
            - -euc
            - npm run db:migrate && exec node_modules/.bin/tsx tools/runSearchIndexer.ts --watch
        environment:
            <<: *runtime-environment
            SEARCH_INDEX_WORKER_ID: search-indexer
        configs:
            - *runtime-config
        volumes:
            - *runtime-volume
        networks: *search-networks
        depends_on:
            meilisearch:
                condition: service_healthy
        healthcheck:
            test:
                [
                    "CMD",
                    "node_modules/.bin/tsx",
                    "tools/checkSearchIndexerHealth.ts",
                ]
            interval: 60s
            timeout: 5s
            start_period: 1h
            start_interval: 2s
            retries: 3
        labels: *runtime-labels
        restart: unless-stopped

    source-sync:
        cgroup_parent: *library-budget
        init: true
        image: "${RUNTIME_IMAGE:?runtime image digest is required}"
        pull_policy: missing
        command: ["node_modules/.bin/tsx", "--conditions=react-server", "tools/runSourceSync.ts", "--watch"]
        environment:
            <<: *runtime-environment
            SOURCE_SYNC_WORKER_ID: source-sync
            # DNS lookups share Node's threadpool with the database driver's. With
            # the default four threads, a PDF stage's many hosts queued the
            # database's lookup past its five-second connect timeout.
            UV_THREADPOOL_SIZE: "128"
        configs:
            - *runtime-config
        volumes:
            - *runtime-volume
        networks: *runtime-networks
        depends_on:
            search-indexer:
                condition: service_healthy
        labels: *runtime-labels
        restart: unless-stopped

    source-writeback:
        cgroup_parent: *library-budget
        init: true
        image: "${RUNTIME_IMAGE:?runtime image digest is required}"
        pull_policy: missing
        command:
            ["node_modules/.bin/tsx", "tools/runSourceWriteback.ts", "--watch"]
        environment:
            <<: *runtime-environment
            SOURCE_WRITEBACK_WORKER_ID: source-writeback
        configs:
            - *runtime-config
        volumes:
            - *runtime-volume
        networks: *runtime-networks
        depends_on:
            search-indexer:
                condition: service_healthy
        labels: *runtime-labels
        restart: unless-stopped

    publication-worker:
        cgroup_parent: *library-budget
        init: true
        image: "${RUNTIME_IMAGE:?runtime image digest is required}"
        pull_policy: missing
        command: ["node", ".next/publication/worker.mjs", "--watch"]
        environment:
            <<: *runtime-environment
            PUBLICATION_WORKER_ID: publication-worker
        configs:
            - *runtime-config
        volumes:
            - *runtime-volume
        networks: *runtime-networks
        depends_on:
            search-indexer:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "node", ".next/publication/health.mjs"]
            interval: 60s
            timeout: 5s
            start_period: 2m
            start_interval: 1s
            retries: 3
        labels: *runtime-labels
        restart: unless-stopped

    meilisearch:
        cgroup_parent: *library-budget
        init: true
        image: getmeili/meilisearch:v1.54
        environment:
            MEILI_ENV: production
            MEILI_MASTER_KEY: "${MEILISEARCH_MASTER_KEY:?private Meilisearch key is required}"
            MEILI_NO_ANALYTICS: "true"
            # Migrates the existing search data in place when the image above
            # moves to a newer Meilisearch, so an update neither empties search
            # nor pays to embed every record again.
            MEILI_UPGRADE_DB: "true"
            # Meilisearch's newer search path builds every result before the
            # requested page, so page 50,000 of a 1M-record library took 18 s.
            # The previous path returns the same totals, facets and hits
            # (apart from the order of exactly tied scores) in under 0.2 s.
            MEILI_EXPERIMENTAL_LEGACY_SEARCH: "true"
            # Meilisearch sizes indexing from the machine, not the slice above:
            # half the host's threads and two-thirds of its memory. These keep
            # one library's reindex inside its share of the budget: three
            # libraries reindexing at once take about 24 GB, leaving room for
            # their workers under the slice's 56 GB before memory is reclaimed.
            MEILI_MAX_INDEXING_THREADS: "8"
            MEILI_MAX_INDEXING_MEMORY: "8 GiB"
        # Meilisearch keeps a file open for every queued batch; the default
        # limit of 1,024 is too low for a large library's first import.
        ulimits:
            nofile:
                soft: 65536
                hard: 65536
        healthcheck:
            test:
                [
                    "CMD",
                    "curl",
                    "--fail",
                    "--silent",
                    "http://127.0.0.1:7700/health",
                ]
            interval: 30s
            timeout: 5s
            start_period: 5m
            start_interval: 1s
            retries: 3
        volumes:
            - meilisearch-data:/meili_data
        networks:
            - private
        labels: *runtime-labels
        restart: unless-stopped

    redis:
        cgroup_parent: *library-budget
        image: redis:7.2-alpine
        init: true
        # Redis is an ephemeral rate-limit store. Mask the image's declared /data
        # volume so container recreation cannot leave empty anonymous volumes behind.
        tmpfs:
            - /data
        command:
            [
                "redis-server",
                "--save",
                "",
                "--appendonly",
                "no",
                "--maxmemory",
                "128mb",
                "--maxmemory-policy",
                "noeviction",
            ]
        networks:
            private:
                aliases:
                    - evidence-library-redis
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 30s
            timeout: 5s
            start_period: 30s
            start_interval: 1s
            retries: 3
        labels: *runtime-labels
        restart: unless-stopped

configs:
    library-config:
        content: "${LIBRARY_CONFIG_JSON:?library config JSON is required}"

volumes:
    library-config-data:
    meilisearch-data:

networks:
    private:
    coolify:
        name: coolify
        external: true
    library-search:
        name: library-search
        external: true
