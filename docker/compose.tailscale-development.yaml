services:
  tailscale:
    build:
      context: .
      dockerfile: ops/tailscale-development/Dockerfile
    hostname: openscholar-el-dev
    environment:
      TS_AUTHKEY: "${TAILSCALE_AUTHKEY:-}"
      TS_AUTH_ONCE: "true"
      TS_HOSTNAME: openscholar-el-dev
      TS_SERVE_CONFIG: /config/serve.json
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
    volumes:
      - ./ops/tailscale-development:/config:ro
      - tailscale-state:/var/lib/tailscale
    healthcheck:
      test: ["CMD-SHELL", "tailscale status --json >/dev/null && nc -z 127.0.0.1 3000"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 6
    labels:
      traefik.enable: "false"
    restart: unless-stopped

  web:
    extends:
      file: docker/compose.library.yaml
      service: web
    build:
      context: .
      dockerfile: Dockerfile
      target: final
    environment:
      ADMIN_AUTH_BYPASS: "true"
    depends_on:
      tailscale:
        condition: service_healthy
      search-indexer:
        condition: service_healthy
    labels:
      traefik.enable: "false"

  search-indexer:
    extends:
      file: docker/compose.library.yaml
      service: search-indexer
    build:
      context: .
      dockerfile: Dockerfile
      target: search-indexer
    labels:
      traefik.enable: "false"

configs:
  library-config:
    content: "${LIBRARY_CONFIG_JSON:?library config JSON is required}"

volumes:
  tailscale-state:
