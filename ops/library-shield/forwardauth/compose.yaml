# Deployed as a Coolify application (compose build pack, base directory
# ops/library-shield/forwardauth). The container is internal-only: Traefik
# reaches it on the coolify network as http://library-shield:8080 (stable network alias = compose service name).
services:
  library-shield:
    build: .
    restart: unless-stopped
    environment:
      CLOUDFLARE_RADAR_API_TOKEN: "${CLOUDFLARE_RADAR_API_TOKEN:-}"
      RADAR_BOT_SYNC_INTERVAL_SECONDS: "${RADAR_BOT_SYNC_INTERVAL_SECONDS:-86400}"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
