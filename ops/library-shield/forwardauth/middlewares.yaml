# Evidence Library shield — Traefik middlewares (file provider).
# Deployed to /data/coolify/proxy/dynamic/ode-library-shield-forwardauth.yaml.
# Attached per-app via Coolify custom_labels on each https router:
#   Cloudflare-proxied hostname:
#     middlewares=gzip,ode-shield-cf-origin@file,ode-shield-rate-cf@file,ode-shield-inflight-cf@file,ode-library-shield@file
#   Direct hostname:
#     middlewares=gzip,ode-shield-rate-direct@file,ode-shield-inflight@file,ode-library-shield@file
http:
  middlewares:
    ode-library-shield:
      forwardAuth:
        address: "http://library-shield:8080/decide"
    # Cloudflare-proxied hostnames must only receive traffic from Cloudflare,
    # otherwise CF-Connecting-IP is forgeable and the rate limit is bypassable.
    ode-shield-cf-origin:
      ipAllowList:
        sourceRange:
          - 173.245.48.0/20
          - 103.21.244.0/22
          - 103.22.200.0/22
          - 103.31.4.0/22
          - 141.101.64.0/18
          - 108.162.192.0/18
          - 190.93.240.0/20
          - 188.114.96.0/20
          - 197.234.240.0/22
          - 198.41.128.0/17
          - 162.158.0.0/15
          - 104.16.0.0/13
          - 104.24.0.0/14
          - 172.64.0.0/13
          - 131.0.72.0/22
          - 2400:cb00::/32
          - 2606:4700::/32
          - 2803:f800::/32
          - 2405:b500::/32
          - 2405:8100::/32
          - 2a06:98c0::/29
          - 2c0f:f248::/32
    ode-shield-rate-cf:
      rateLimit:
        average: 20
        period: 1s
        burst: 80
        sourceCriterion:
          requestHeaderName: CF-Connecting-IP
    ode-shield-rate-direct:
      rateLimit:
        average: 20
        period: 1s
        burst: 80
    # Behind Cloudflare the connecting address is a Cloudflare edge shared by
    # many visitors, so count each visitor by CF-Connecting-IP instead.
    ode-shield-inflight-cf:
      inFlightReq:
        amount: 40
        sourceCriterion:
          requestHeaderName: CF-Connecting-IP
    ode-shield-inflight:
      inFlightReq:
        amount: 40
