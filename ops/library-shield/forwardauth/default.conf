# Evidence Library shield — forwardAuth decision endpoint.
# Traefik calls /decide for every request to a library app (middleware
# ode-library-shield). 2xx = pass through to the app; 401 = serve the
# browser-check page; 403 = banned network, training crawler, or unverified
# dynamic request.
# Traefik forwards the original request headers plus
# X-Forwarded-Method/-Uri/-Host. The crawler maps are generated in
# /etc/nginx/conf.d/10-radar-bots.conf from Cloudflare Radar data.

map $http_x_forwarded_for $ode_forwarded_client_ip {
	default $remote_addr;
	"~^\s*(?<ode_first_forwarded_ip>[0-9A-Fa-f:.]+)(?:,|$)" $ode_first_forwarded_ip;
}

map $http_cf_connecting_ip $ode_cloudflare_client_ip {
	default $http_cf_connecting_ip;
	"" 127.0.0.1;
}

geo $ode_forwarded_client_ip $ode_banned_forwarded_ip {
	default 0;
	include /etc/nginx/bot-policy/banned-ips.conf;
}

geo $ode_cloudflare_client_ip $ode_banned_cloudflare_ip {
	default 0;
	include /etc/nginx/bot-policy/banned-ips.conf;
}

map "$ode_banned_forwarded_ip|$ode_banned_cloudflare_ip" $ode_banned_ip {
	default 0;
	"~1" 1;
}

map $http_cookie $ode_has_cookie {
	default 0;
	"~(^|;\s*)ode_browser_check=1(;|$)" 1;
}

map $http_x_forwarded_uri $ode_bypass_uri {
	default 0;
	"~^/api/feature-flags/sync(\?|$)" 1;
	"~^/api/unapi(\?|$)" 1;
	"~^/(_next|_vercel)(/|$)" 1;
	"~^/robots\.txt(\?|$)" 1;
	"~^/sitemap(-index)?(/|\.|$)" 1;
	"~^/([a-z]{2}(-[A-Z]{2})?/)?(lib|profile/[^/]+)/atom\.xml(\?|$)" 1;
	"~^/([a-z]{2}(-[A-Z]{2})?/)?lib/[^/]+/(download|export)(/|$)" 1;
	"~*\.(avif|bmp|css|csv|gif|ico|jpe?g|js|json|map|pdf|png|svg|txt|webmanifest|webp|woff2?|xml)(\?|$)" 1;
}

map $http_x_forwarded_uri $ode_robots_uri {
	default 0;
	"~^/robots\.txt(\?|$)" 1;
}

map $http_accept $ode_wants_html {
	default 0;
	"~*text/html" 1;
}

# Allowed bots bypass the JS challenge, so each hostname gives every Radar
# category its own rate budget: a search crawl cannot starve link previews.
# $ode_allowed_crawler holds the matched bot's category.
limit_req_zone "$http_x_forwarded_host|$ode_allowed_crawler" zone=ode_crawlers:10m rate=3r/s;

# Unknown clients need the JavaScript cookie for every dynamic route. The
# challenge is useful only for top-level HTML; API, RSC, prefetch, and other
# non-browser requests get a plain 403 instead.
map "$ode_has_cookie|$ode_bypass_uri" $ode_unverified_dynamic {
	default 0;
	"0|0" 1;
}

map "$ode_unverified_dynamic|$http_x_forwarded_method|$ode_wants_html|$http_rsc|$http_next_router_prefetch" $ode_challenge {
	default 0;
	"1|GET|1||" 1;
}

server {
	listen 8080 default_server;
	server_name _;
	server_tokens off;

	location = /healthz {
		access_log off;
		return 204;
	}

	# Traefik routes explicitly denied Cloudflare source IPs here. Keeping the
	# response in this service avoids a second one-purpose block container.
	location = /forbidden {
		return 403 'Forbidden';
	}

	# Crawler passes route here so limit_req (preaccess phase) actually runs;
	# a plain `return 204` inside /decide would short-circuit it in the
	# rewrite phase. try_files supplies the 204 from the content phase.
	location = /crawler_pass {
		internal;
		limit_req zone=ode_crawlers burst=15 nodelay;
		limit_req_status 429;
		try_files /nonexistent =204;
	}

	location = /decide {
		default_type text/html;
		add_header Cache-Control "no-store, no-cache, must-revalidate, no-transform" always;
		add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; frame-ancestors 'none'" always;
		add_header Referrer-Policy "no-referrer" always;
		add_header X-Content-Type-Options "nosniff" always;
		add_header X-ODE-Library-Shield "challenge" always;
		add_header X-Robots-Tag "noindex, nofollow" always;

		if ($ode_banned_ip) {
			return 403 'Forbidden';
		}
		# Even blocked crawlers must be able to read the site's opt-out policy.
		if ($ode_robots_uri) {
			return 204;
		}
		if ($ode_training_crawler) {
			return 403 'Forbidden';
		}
		if ($ode_allowed_crawler) {
			rewrite ^ /crawler_pass last;
		}
		if ($ode_unverified_dynamic = 0) {
			return 204;
		}
		if ($ode_challenge = 0) {
			return 403 'Forbidden';
		}
		return 401 '<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checking your browser</title></head><body style="font-family:system-ui,sans-serif;margin:3rem;line-height:1.4"><main><h1>Checking your browser…</h1><p>Please wait a moment.</p></main><script>document.cookie="ode_browser_check=1; Max-Age=2592000; Path=/; SameSite=Lax; Secure";setTimeout(function(){window.location.reload()},350)</script><noscript>Please enable JavaScript and reload.</noscript></body></html>';
	}
}
