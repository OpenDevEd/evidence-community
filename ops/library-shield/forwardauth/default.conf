# Evidence Library shield — forwardAuth decision endpoint.
# Traefik calls /decide for every request to a library app (middleware
# ode-library-shield). 2xx = pass through to the app; 401 = serve the
# browser-check page; 403 = blocked crawler. Traefik forwards the original
# request headers plus X-Forwarded-Method/-Uri/-Host.

map $http_user_agent $ode_bad_bot {
	default 0;
	"~*(meta-externalagent|facebookexternalhit|AliyunSecBot|DotBot|AhrefsBot|DataForSeoBot|Baiduspider|Amazonbot|MJ12bot|SemrushBot|PetalBot|Bytespider|YandexBot|GPTBot|ClaudeBot|ChatGPT-User|OAI-SearchBot|CCBot|SleepBot|YisouSpider)" 1;
}

map $http_user_agent $ode_good_crawler {
	default 0;
	"~*(Googlebot|GoogleOther|bingbot|BingPreview|Applebot|DuckDuckBot|Slurp)" 1;
}

map $http_cookie $ode_has_cookie {
	default 0;
	"~(^|;\s*)ode_browser_check=1(;|$)" 1;
}

map $http_x_forwarded_uri $ode_bypass_uri {
	default 0;
	"~^/api(/|$)" 1;
	"~^/(_next|_vercel)(/|$)" 1;
	"~^/robots\.txt(\?|$)" 1;
	"~^/sitemap(-index)?(/|\.|$)" 1;
	"~^/([a-z]{2}(-[A-Z]{2})?/)?(lib|profile/[^/]+)/atom\.xml(\?|$)" 1;
	"~^/([a-z]{2}(-[A-Z]{2})?/)?lib/[^/]+/(download|export)(/|$)" 1;
	"~*\.(avif|bmp|css|csv|gif|ico|jpe?g|js|json|map|pdf|png|svg|txt|webmanifest|webp|woff2?|xml)(\?|$)" 1;
	"~[?&]_rsc=" 1;
}

map $http_accept $ode_wants_html {
	default 0;
	"~*text/html" 1;
}

# Search crawlers bypass the JS challenge, so they get their own rate budget.
# Empty key = request not counted, so only good-crawler traffic is limited here.
map $ode_good_crawler $ode_crawler_key {
	default "";
	1 "$http_cf_connecting_ip:$http_user_agent";
}

limit_req_zone $ode_crawler_key zone=ode_crawlers:10m rate=3r/s;

# Challenge only uncookied top-level GET HTML documents; everything else passes.
map "$http_x_forwarded_method|$ode_has_cookie|$ode_bypass_uri|$ode_wants_html|$http_rsc|$http_next_router_prefetch" $ode_challenge {
	default 0;
	"GET|0|0|1||" 1;
}

server {
	listen 8080 default_server;
	server_name _;
	server_tokens off;

	location = /healthz {
		access_log off;
		return 204;
	}

	# Crawler passes route here so limit_req (preaccess phase) actually runs;
	# a plain `return 204` inside /decide would short-circuit it in the
	# rewrite phase. try_files supplies the 204 from the content phase.
	location = /crawler_pass {
		internal;
		limit_req zone=ode_crawlers burst=15 nodelay;
		limit_req_status 429;
		try_files /nonexistent =204;
	}

	location = /decide {
		default_type text/html;
		add_header Cache-Control "no-store, no-cache, must-revalidate, no-transform" always;
		add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; frame-ancestors 'none'" always;
		add_header Referrer-Policy "no-referrer" always;
		add_header X-Content-Type-Options "nosniff" always;
		add_header X-ODE-Library-Shield "challenge" always;
		add_header X-Robots-Tag "noindex, nofollow" always;

		if ($ode_bad_bot) {
			return 403 'Forbidden';
		}
		if ($ode_good_crawler) {
			rewrite ^ /crawler_pass last;
		}
		if ($ode_challenge = 0) {
			return 204;
		}
		return 401 '<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checking your browser</title></head><body style="font-family:system-ui,sans-serif;margin:3rem;line-height:1.4"><main><h1>Checking your browser…</h1><p>Please wait a moment.</p></main><script>document.cookie="ode_browser_check=1; Max-Age=1800; Path=/; SameSite=Lax; Secure";setTimeout(function(){window.location.reload()},350)</script><noscript>Please enable JavaScript and reload.</noscript></body></html>';
	}
}
