# Rate limiting zones (shared across all sites)
# Install to /etc/nginx/conf.d/rate-limiting.conf
limit_req_zone $binary_remote_addr zone=per_ip:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=per_ip_conn:10m;

# Bot detection map
map $http_user_agent $is_bad_bot {
    default 0;
    ~*Chrome/133\.0\.6943\.141  1;
    ~*MSIE\x207\.0              1;
    ~*Firefox/5\.0              1;
    ~*QIHU                      1;
    ~*Chrome/69\.0\.3497        1;
    ~*Sogou                     1;
    ~*Bytespider                1;
    ~*DotBot                    1;
    ~*AhrefsBot                 1;
    ~*SemrushBot                1;
    ~*MJ12bot                   1;
    ~*PetalBot                  1;
    ~*YandexBot                 1;
}
