
services:
  app:
    build: .
    ports:
      - "3000:3000"
    depends_on:
      - meilisearch

  meilisearch:
    image: getmeili/meilisearch:latest
    ports:
      - "7700:7700"
    volumes:
      - ./meili_data:/meili_data
    environment:
      MEILI_NO_ANALYTICS: "true"
      MASTER_KEY: "masterkeysadfdasfdsafdsafdsgfawdfgadsfdasfadsfasd"
